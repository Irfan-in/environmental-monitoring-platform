services:
  - type: web
    name: environmental-monitoring-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run_server.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.12
