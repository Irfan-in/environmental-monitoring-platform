services:
  - type: web
    name: environmental-monitoring-backend
    runtime: python
    rootDir: environmental_monitoring_platform/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_server.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.8
